<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap');
      .font-fraunces { font-family: 'Fraunces', serif; font-weight: 600; }
      .font-hanken { font-family: 'Hanken Grotesk', sans-serif; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1B2520" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background: Cream #F4EEE2 -->
  <rect width="1080" height="1080" fill="#F4EEE2"/>

  <!-- Main Container -->
  <rect x="80" y="80" width="920" height="920" rx="32" fill="#FFFFFF" filter="url(#shadow)"/>

  <!-- Brand Header -->
  <text x="140" y="160" class="font-hanken" font-size="22" font-weight="700" fill="#1E5E4E" letter-spacing="2">IMMIGREI APP</text>

  <!-- Product Angle Headline in Fraunces -->
  <text x="140" y="240" class="font-fraunces" font-size="46" fill="#1B2520">
    <tspan x="140" dy="0">O próximo formulário já está</tspan>
    <tspan x="140" dy="60" fill="#1E5E4E">pronto pra você preencher</tspan>
  </text>

  <!-- App UI Mockup Card -->
  <g transform="translate(140, 340)">
    <rect x="0" y="0" width="800" height="380" rx="24" fill="#F4EEE2" stroke="#1E5E4E" stroke-width="2" stroke-dasharray="6 6"/>
    
    <!-- UI Header bar -->
    <rect x="0" y="0" width="800" height="60" rx="24" fill="#1E5E4E"/>
    <rect x="0" y="36" width="800" height="24" fill="#1E5E4E"/>
    <text x="40" y="38" class="font-hanken" font-size="20" font-weight="700" fill="#F4EEE2">Seu Kit da Próxima Etapa • Immigrei</text>
    
    <!-- Form Card 1: I-485 -->
    <g transform="translate(40, 90)">
      <rect x="0" y="0" width="720" height="74" rx="16" fill="#FFFFFF"/>
      <rect x="20" y="17" width="100" height="40" rx="8" fill="#1E5E4E"/>
      <text x="70" y="43" class="font-hanken" font-size="18" font-weight="700" fill="#F4EEE2" text-anchor="middle">I-485</text>
      <text x="140" y="43" class="font-hanken" font-size="20" font-weight="600" fill="#1B2520">Ajuste de Status (Disponível no app)</text>
      <circle cx="670" cy="37" r="16" fill="#E8A33D" opacity="0.2"/>
      <text x="670" y="44" class="font-hanken" font-size="18" font-weight="700" fill="#1E5E4E" text-anchor="middle">✓</text>
    </g>

    <!-- Form Card 2: I-130A -->
    <g transform="translate(40, 180)">
      <rect x="0" y="0" width="720" height="74" rx="16" fill="#FFFFFF"/>
      <rect x="20" y="17" width="100" height="40" rx="8" fill="#1E5E4E"/>
      <text x="70" y="43" class="font-hanken" font-size="18" font-weight="700" fill="#F4EEE2" text-anchor="middle">I-130A</text>
      <text x="140" y="43" class="font-hanken" font-size="20" font-weight="600" fill="#1B2520">Informações Suplementares do Cônjuge</text>
      <circle cx="670" cy="37" r="16" fill="#E8A33D" opacity="0.2"/>
      <text x="670" y="44" class="font-hanken" font-size="18" font-weight="700" fill="#1E5E4E" text-anchor="middle">✓</text>
    </g>

    <!-- Form Card 3: I-765 -->
    <g transform="translate(40, 270)">
      <rect x="0" y="0" width="720" height="74" rx="16" fill="#FFFFFF"/>
      <rect x="20" y="17" width="100" height="40" rx="8" fill="#1E5E4E"/>
      <text x="70" y="43" class="font-hanken" font-size="18" font-weight="700" fill="#F4EEE2" text-anchor="middle">I-765</text>
      <text x="140" y="43" class="font-hanken" font-size="20" font-weight="600" fill="#1B2520">Autorização de Trabalho (EAD)</text>
      <circle cx="670" cy="37" r="16" fill="#E8A33D" opacity="0.2"/>
      <text x="670" y="44" class="font-hanken" font-size="18" font-weight="700" fill="#1E5E4E" text-anchor="middle">✓</text>
    </g>
  </g>

  <!-- Discrete CTA Button -->
  <g transform="translate(140, 770)">
    <rect x="0" y="0" width="800" height="64" rx="32" fill="#E8A33D"/>
    <text x="400" y="40" class="font-hanken" font-size="22" font-weight="700" fill="#1B2520" text-anchor="middle">Acompanhe sua jornada no Immigrei</text>
  </g>

  <!-- Mandatory Footer Disclaimer -->
  <text x="540" y="955" class="font-hanken" font-size="18" fill="#1B2520" opacity="0.6" text-anchor="middle">Conteúdo informativo, não é aconselhamento jurídico.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <style>
      .font-fraunces { font-family: 'Georgia', serif; font-weight: 700; }
      .font-hanken { font-family: 'Avenir Next', 'Helvetica', sans-serif; }
    </style>
  </defs>
  <rect width="1080" height="1920" fill="#F4EEE2"/>
  <text x="115" y="140" class="font-hanken" font-size="26" font-weight="700" fill="#1E5E4E" letter-spacing="3">IMMIGREI</text>

  <g transform="translate(115, 700)">
    <rect x="0" y="0" width="850" height="500" rx="28" fill="#1E5E4E"/>
    <text x="45" y="80" class="font-hanken" font-size="26" font-weight="700" fill="#E8A33D" letter-spacing="1">IMMIGREI EXPLICA</text>
    <text x="45" y="180" class="font-fraunces" font-size="46" fill="#F4EEE2">
      <tspan x="45" dy="0">Fim do "D/S" pra</tspan>
      <tspan x="45" dy="56">F-1 e J-1.</tspan>
    </text>
    <text x="45" y="330" class="font-hanken" font-size="28" fill="#F4EEE2" opacity="0.9">
      <tspan x="45" dy="0">Confira a edição no rodapé</tspan>
      <tspan x="45" dy="40">do PDF, no site oficial</tspan>
      <tspan x="45" dy="40">do USCIS, antes de enviar.</tspan>
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap');
      .font-fraunces { font-family: 'Fraunces', serif; font-weight: 600; }
      .font-hanken { font-family: 'Hanken Grotesk', sans-serif; }
    </style>
  </defs>

  <rect width="1080" height="1920" fill="#1E5E4E"/>
  <circle cx="980" cy="220" r="450" fill="#E8A33D" opacity="0.08"/>
  <circle cx="100" cy="1700" r="400" fill="#F4EEE2" opacity="0.05"/>

  <text x="540" y="220" class="font-hanken" font-size="26" font-weight="700" fill="#F4EEE2" letter-spacing="3" text-anchor="middle">IMMIGREI</text>

  <text x="540" y="760" class="font-fraunces" font-size="64" fill="#F4EEE2" text-anchor="middle">
    <tspan x="540" dy="0">ATENÇÃO</tspan>
  </text>
  <text x="540" y="850" class="font-hanken" font-size="30" font-weight="600" fill="#F4EEE2" text-anchor="middle">
    <tspan x="540" dy="0">quem vai protocolar</tspan>
    <tspan x="540" dy="42">I-539 ou I-765</tspan>
  </text>

  <g transform="translate(280, 960)">
    <rect x="0" y="0" width="520" height="80" rx="40" fill="#E8A33D"/>
    <text x="260" y="52" class="font-hanken" font-size="30" font-weight="700" fill="#1B2520" text-anchor="middle">o USCIS muda amanhã (15/09)</text>
  </g>

  <g transform="translate(440, 1500)">
    <circle cx="100" cy="60" r="55" fill="none" stroke="#E8A33D" stroke-width="4"/>
    <text x="100" y="75" class="font-fraunces" font-size="52" fill="#E8A33D" text-anchor="middle">1</text>
  </g>
  <text x="540" y="1620" class="font-hanken" font-size="24" fill="#F4EEE2" opacity="0.85" text-anchor="middle">dia até a mudança</text>

  <text x="540" y="1800" class="font-hanken" font-size="22" fill="#F4EEE2" opacity="0.7" text-anchor="middle">Vê o próximo story →</text>
</svg>

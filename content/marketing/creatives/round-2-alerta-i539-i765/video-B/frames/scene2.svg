<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <style>
      .font-fraunces { font-family: 'Georgia', serif; font-weight: 700; }
      .font-hanken { font-family: 'Avenir Next', 'Helvetica', sans-serif; }
    </style>
  </defs>
  <rect width="1080" height="1920" fill="#F4EEE2"/>
  <text x="115" y="140" class="font-hanken" font-size="26" font-weight="700" fill="#1E5E4E" letter-spacing="3">IMMIGREI</text>

  <text x="115" y="280" class="font-fraunces" font-size="56" fill="#1B2520">
    <tspan x="115" dy="0">O USCIS troca a</tspan>
    <tspan x="115" dy="66" fill="#C2542F">edição amanhã.</tspan>
  </text>

  <g transform="translate(115, 420)">
    <rect x="0" y="0" width="850" height="120" rx="20" fill="#1E5E4E"/>
    <text x="40" y="76" class="font-hanken" font-size="32" font-weight="700" fill="#F4EEE2">Edição antiga só até hoje</text>
  </g>
  <g transform="translate(115, 570)">
    <rect x="0" y="0" width="850" height="120" rx="20" fill="#E8A33D"/>
    <text x="40" y="76" class="font-hanken" font-size="32" font-weight="700" fill="#1B2520">Amanhã, só a edição nova</text>
  </g>

  <text x="115" y="820" class="font-hanken" font-size="30" fill="#1B2520" opacity="0.85">
    <tspan x="115" dy="0">Errar a edição derruba o</tspan>
    <tspan x="115" dy="40">pacote inteiro, sem revisão.</tspan>
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <style>
      .font-fraunces { font-family: 'Georgia', serif; font-weight: 700; }
      .font-hanken { font-family: 'Avenir Next', 'Helvetica', sans-serif; }
    </style>
  </defs>
  <rect width="1080" height="1920" fill="#1E5E4E"/>
  <text x="115" y="140" class="font-hanken" font-size="26" font-weight="700" fill="#F4EEE2" letter-spacing="3">IMMIGREI</text>

  <g transform="translate(115, 650)">
    <rect x="0" y="0" width="850" height="480" rx="28" fill="#F4EEE2"/>
    <text x="45" y="80" class="font-hanken" font-size="26" font-weight="700" fill="#E8A33D" letter-spacing="1">ANTES DE PROTOCOLAR</text>
    <text x="45" y="170" class="font-fraunces" font-size="42" fill="#1B2520">
      <tspan x="45" dy="0">Baixe do site oficial</tspan>
      <tspan x="45" dy="52">do USCIS.</tspan>
    </text>
    <text x="45" y="300" class="font-hanken" font-size="28" fill="#1B2520" opacity="0.85">
      <tspan x="45" dy="0">Confira a edição no rodapé</tspan>
      <tspan x="45" dy="38">do PDF — um detalhe que</tspan>
      <tspan x="45" dy="38">evita meses de atraso.</tspan>
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <style>
      .font-fraunces { font-family: 'Georgia', serif; font-weight: 700; }
      .font-hanken { font-family: 'Avenir Next', 'Helvetica', sans-serif; }
    </style>
  </defs>
  <rect width="1080" height="1920" fill="#F4EEE2"/>
  <text x="115" y="140" class="font-hanken" font-size="26" font-weight="700" fill="#1E5E4E" letter-spacing="3">IMMIGREI</text>

  <text x="115" y="820" class="font-fraunces" font-size="60" fill="#1B2520">
    <tspan x="115" dy="0">Tá de olho nessas</tspan>
    <tspan x="115" dy="72" fill="#1E5E4E">mudanças pra você</tspan>
    <tspan x="115" dy="72" fill="#1E5E4E">não perder nada.</tspan>
  </text>

  <g transform="translate(115, 1080)">
    <rect x="0" y="0" width="460" height="80" rx="40" fill="#E8A33D"/>
    <text x="230" y="52" class="font-hanken" font-size="30" font-weight="700" fill="#1B2520" text-anchor="middle">Link na bio</text>
  </g>

  <text x="115" y="1650" class="font-hanken" font-size="22" fill="#1B2520" opacity="0.6">
    <tspan x="115" dy="0">Este conteúdo é informativo e não constitui</tspan>
    <tspan x="115" dy="30">aconselhamento jurídico; consulte um advogado</tspan>
    <tspan x="115" dy="30">de imigração licenciado para o seu caso.</tspan>
  </text>
</svg>

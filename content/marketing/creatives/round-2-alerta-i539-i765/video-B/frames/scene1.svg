  <text x="115" y="750" class="font-fraunces" font-size="90" fill="#E8A33D">Faltam</text>
  <text x="115" y="880" class="font-fraunces" font-size="110" fill="#F4EEE2">24 horas.</text>
  <text x="115" y="960" class="font-hanken" font-size="32" fill="#F4EEE2" opacity="0.9">
    <tspan x="115" dy="0">Vai protocolar I-539 ou</tspan>

<!--
  Statue of Liberty — placeholder vector motif, immigrei brand line-art style,
  matching golden-gate-bridge.svg in this folder (same stroke-based, no-fill
  aesthetic). Vector because no real photo/stock asset was available when this
  was first drawn — swap for a licensed photo/AI-stock plate before a piece
  goes final, or keep as-is for a lightweight vector treatment. Designed as a
  low-opacity background watermark (not a literal icon) — keep it under ~10%
  opacity wherever it sits behind body text so it never competes with copy.
  viewBox is a tall local coordinate space (480x1100); scale/position the
  container to taste.
  First used: Reel "De Turista (B1/B2) para Estudante (F1)" (out/2026), Cena 4.
-->
<svg viewBox="0 0 480 1100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- ground -->
  <line x1="40" y1="1080" x2="440" y2="1080" stroke="var(--pine)" stroke-width="8"/>

  <!-- pedestal -->
  <path d="M140 1080 L162 940 L318 940 L340 1080 Z" stroke="var(--pine)" stroke-width="8"/>
  <line x1="176" y1="1000" x2="304" y2="1000" stroke="var(--pine)" stroke-width="4" opacity=".6"/>
  <line x1="168" y1="1040" x2="312" y2="1040" stroke="var(--pine)" stroke-width="4" opacity=".6"/>

  <!-- robe body -->
  <path d="M190 560 C168 660 158 810 170 940 L310 940 C322 810 312 660 290 560 Z" stroke="var(--pine)" stroke-width="8"/>
  <path d="M240 575 C230 700 226 830 230 940" stroke="var(--pine)" stroke-width="4" opacity=".55"/>
  <path d="M212 580 C198 700 192 820 198 940" stroke="var(--pine)" stroke-width="4" opacity=".4"/>
  <path d="M268 580 C282 700 288 820 282 940" stroke="var(--pine)" stroke-width="4" opacity=".4"/>

  <!-- left arm + tablet at hip -->
  <path d="M195 585 C178 610 168 640 166 670" stroke="var(--pine)" stroke-width="7"/>
  <rect x="150" y="655" width="34" height="60" rx="3" stroke="var(--pine)" stroke-width="5"/>

  <!-- raised right arm + torch -->
  <path d="M285 585 C320 560 342 500 346 430" stroke="var(--pine)" stroke-width="8"/>
  <path d="M346 430 L350 300" stroke="var(--pine)" stroke-width="7"/>
  <path d="M332 300 L368 300 L360 258 L340 258 Z" stroke="var(--pine)" stroke-width="6"/>
  <path d="M340 258 C336 230 344 206 350 188 C356 206 364 230 360 258" stroke="var(--pine)" stroke-width="5"/>

  <!-- head -->
  <circle cx="250" cy="520" r="42" stroke="var(--pine)" stroke-width="7"/>

  <!-- crown spikes -->
  <g stroke="var(--pine)" stroke-width="6" stroke-linecap="round">
    <line x1="250" y1="478" x2="250" y2="430"/>
    <line x1="222" y1="486" x2="196" y2="448"/>
    <line x1="278" y1="486" x2="304" y2="448"/>
    <line x1="200" y1="504" x2="160" y2="480"/>
    <line x1="300" y1="504" x2="340" y2="480"/>
    <line x1="212" y1="528" x2="172" y2="522"/>
    <line x1="288" y1="528" x2="328" y2="522"/>
  </g>
</svg>

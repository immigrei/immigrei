<!--
  Golden Gate Bridge — placeholder vector motif, immigrei brand line-art style.
  Used as a subtle background silhouette (not a literal icon). Vector because no
  real photo/stock asset was available when this was first drawn — swap for a
  licensed photo/AI-stock plate before a piece goes final, or keep as-is for a
  lightweight vector treatment. Strokes use var(--pine-deep) on a --pine
  background (see Reel Cena 1 in reel-template/README.md). viewBox matches a
  1440-wide frame at native scale — position/opacity per placement.
  First used: Reel "De Turista (B1/B2) para Estudante (F1)" (out/2026).
-->

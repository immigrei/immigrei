<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap');
      .font-fraunces { font-family: 'Fraunces', serif; font-weight: 600; }
      .font-hanken { font-family: 'Hanken Grotesk', sans-serif; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1B2520" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="#1E5E4E"/>
  <circle cx="980" cy="100" r="300" fill="#E8A33D" opacity="0.08"/>
  <circle cx="100" cy="980" r="250" fill="#F4EEE2" opacity="0.05"/>

  <rect x="90" y="90" width="900" height="900" rx="32" fill="#F4EEE2" filter="url(#shadow)"/>

  <text x="140" y="170" class="font-hanken" font-size="24" font-weight="700" fill="#1E5E4E" letter-spacing="2">IMMIGREI</text>
  <g transform="translate(860, 140)">
    <rect x="0" y="0" width="80" height="36" rx="18" fill="#E4EFE9"/>
    <text x="40" y="24" class="font-hanken" font-size="18" font-weight="700" fill="#1E5E4E" text-anchor="middle">7 / 7</text>
  </g>

  <text x="140" y="380" class="font-fraunces" font-size="52" fill="#1B2520">
    <tspan x="140" dy="0">O Immigrei te explica</tspan>
    <tspan x="140" dy="66" fill="#1E5E4E">cada mudança assim</tspan>
    <tspan x="140" dy="66">que ela sai.</tspan>
  </text>

  <text x="140" y="560" class="font-hanken" font-size="26" fill="#1B2520">Sem enrolação, em português.</text>

  <g transform="translate(140, 650)">
    <rect x="0" y="0" width="460" height="60" rx="30" fill="#E8A33D"/>
    <text x="230" y="37" class="font-hanken" font-size="22" font-weight="700" fill="#1B2520" text-anchor="middle">Acompanhe sua jornada no Immigrei</text>
  </g>

  <text x="140" y="900" class="font-hanken" font-size="18" fill="#1B2520" opacity="0.6">
    <tspan x="140" dy="0">Este conteúdo é informativo e não constitui</tspan>
    <tspan x="140" dy="24">aconselhamento jurídico; consulte um advogado de</tspan>
    <tspan x="140" dy="24">imigração licenciado para o seu caso.</tspan>
  </text>
</svg>

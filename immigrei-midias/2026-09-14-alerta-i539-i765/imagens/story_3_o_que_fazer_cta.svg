<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap');
      .font-fraunces { font-family: 'Fraunces', serif; font-weight: 600; }
      .font-hanken { font-family: 'Hanken Grotesk', sans-serif; }
    </style>
  </defs>

  <rect width="1080" height="1920" fill="#1E5E4E"/>
  <circle cx="100" cy="200" r="400" fill="#E8A33D" opacity="0.08"/>
  <circle cx="980" cy="1700" r="400" fill="#F4EEE2" opacity="0.05"/>

  <text x="540" y="220" class="font-hanken" font-size="26" font-weight="700" fill="#F4EEE2" letter-spacing="3" text-anchor="middle">IMMIGREI</text>

  <text x="540" y="600" class="font-fraunces" font-size="52" fill="#F4EEE2" text-anchor="middle">Vai protocolar</text>
  <text x="540" y="670" class="font-fraunces" font-size="52" fill="#F4EEE2" text-anchor="middle">essa semana?</text>

  <rect x="120" y="780" width="840" height="260" rx="28" fill="#F4EEE2"/>
  <text x="160" y="870" class="font-hanken" font-size="28" font-weight="700" fill="#1E5E4E">Confira a edição no rodapé</text>
  <text x="160" y="915" class="font-hanken" font-size="26" font-weight="700" fill="#1E5E4E">do PDF antes de enviar.</text>
  <text x="160" y="985" class="font-hanken" font-size="22" fill="#1B2520">Baixe direto do site oficial do USCIS.</text>

  <g transform="translate(240, 1140)">
    <rect x="0" y="0" width="600" height="72" rx="36" fill="#E8A33D"/>
    <text x="300" y="46" class="font-hanken" font-size="24" font-weight="700" fill="#1B2520" text-anchor="middle">Link na bio → immigrei.app</text>
  </g>

  <text x="540" y="1300" class="font-hanken" font-size="18" fill="#F4EEE2" opacity="0.75" text-anchor="middle">
    <tspan x="540" dy="0">Este conteúdo é informativo e não constitui</tspan>
    <tspan x="540" dy="24">aconselhamento jurídico; consulte um advogado de</tspan>
    <tspan x="540" dy="24">imigração licenciado para o seu caso.</tspan>
  </text>
</svg>

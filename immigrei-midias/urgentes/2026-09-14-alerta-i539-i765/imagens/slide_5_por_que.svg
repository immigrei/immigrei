<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap');
      .font-fraunces { font-family: 'Fraunces', serif; font-weight: 600; }
      .font-hanken { font-family: 'Hanken Grotesk', sans-serif; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1B2520" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="#F4EEE2"/>
  <rect x="80" y="80" width="920" height="920" rx="32" fill="#FFFFFF" filter="url(#shadow)"/>

  <text x="140" y="160" class="font-hanken" font-size="22" font-weight="700" fill="#1E5E4E" letter-spacing="2">IMMIGREI</text>
  <g transform="translate(860, 130)">
    <rect x="0" y="0" width="80" height="36" rx="18" fill="#F4EEE2"/>
    <text x="40" y="24" class="font-hanken" font-size="18" font-weight="700" fill="#1E5E4E" text-anchor="middle">5 / 7</text>
  </g>

  <text x="140" y="300" class="font-fraunces" font-size="48" fill="#1B2520">
    <tspan x="140" dy="0">Por que a</tspan>
    <tspan x="140" dy="60">mudança?</tspan>
  </text>

  <rect x="140" y="380" width="800" height="300" rx="20" fill="#E4EFE9"/>
  <text x="180" y="440" class="font-hanken" font-size="26" font-weight="700" fill="#1E5E4E">Fim do "D/S" para F-1, J-1 e mídia estrangeira</text>
  <text x="180" y="495" class="font-hanken" font-size="23" fill="#1B2520">
    <tspan x="180" dy="0">A nova edição implementa a regra final do USCIS</tspan>
    <tspan x="180" dy="34">que acaba com o "Duration of Status" (D/S) —</tspan>
    <tspan x="180" dy="34">admissão passa a ter data fixa no I-94 para</tspan>
    <tspan x="180" dy="34">essas categorias.</tspan>
  </text>

  <text x="540" y="955" class="font-hanken" font-size="18" fill="#1B2520" opacity="0.6" text-anchor="middle">Conteúdo informativo, não é aconselhamento jurídico.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap');
      .font-fraunces { font-family: 'Fraunces', serif; font-weight: 600; }
      .font-hanken { font-family: 'Hanken Grotesk', sans-serif; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1B2520" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="#F4EEE2"/>
  <rect x="80" y="80" width="920" height="920" rx="32" fill="#FFFFFF" filter="url(#shadow)"/>

  <text x="140" y="160" class="font-hanken" font-size="22" font-weight="700" fill="#1E5E4E" letter-spacing="2">IMMIGREI</text>
  <g transform="translate(860, 130)">
    <rect x="0" y="0" width="80" height="36" rx="18" fill="#F4EEE2"/>
    <text x="40" y="24" class="font-hanken" font-size="18" font-weight="700" fill="#1E5E4E" text-anchor="middle">2 / 7</text>
  </g>

  <g transform="translate(140, 220)">
    <rect x="0" y="0" width="380" height="52" rx="26" fill="#1E5E4E"/>
    <circle cx="26" cy="26" r="8" fill="#E8A33D"/>
    <text x="48" y="33" class="font-hanken" font-size="20" font-weight="700" fill="#F4EEE2">I-539 e I-765</text>
  </g>

  <text x="140" y="380" class="font-fraunces" font-size="52" fill="#1B2520">
    <tspan x="140" dy="0">A partir de</tspan>
    <tspan x="140" dy="66" fill="#C2542F">15/09/2026,</tspan>
    <tspan x="140" dy="66">muda a edição aceita</tspan>
  </text>

  <rect x="140" y="600" width="800" height="180" rx="20" fill="#F4EEE2"/>
  <text x="180" y="660" class="font-hanken" font-size="24" fill="#1B2520">
    <tspan x="180" dy="0">O USCIS publicou uma nova edição dos dois</tspan>
    <tspan x="180" dy="36">formulários. Não existe período de transição.</tspan>
  </text>

  <text x="540" y="955" class="font-hanken" font-size="18" fill="#1B2520" opacity="0.6" text-anchor="middle">Conteúdo informativo, não é aconselhamento jurídico.</text>
</svg>

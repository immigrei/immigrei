<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap');
      .font-fraunces { font-family: 'Fraunces', serif; font-weight: 600; }
      .font-hanken { font-family: 'Hanken Grotesk', sans-serif; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1B2520" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="#1E5E4E"/>
  <circle cx="980" cy="100" r="300" fill="#E8A33D" opacity="0.08"/>
  <circle cx="100" cy="980" r="250" fill="#F4EEE2" opacity="0.05"/>

  <rect x="90" y="90" width="900" height="900" rx="32" fill="#F4EEE2" filter="url(#shadow)"/>
  <rect x="90" y="90" width="900" height="16" rx="8" fill="#E8A33D"/>

  <text x="140" y="170" class="font-hanken" font-size="24" font-weight="700" fill="#1E5E4E" letter-spacing="2">IMMIGREI</text>

  <g transform="translate(140, 210)">
    <rect x="0" y="0" width="300" height="56" rx="28" fill="#C2542F"/>
    <circle cx="28" cy="28" r="10" fill="#F4EEE2"/>
    <text x="52" y="35" class="font-hanken" font-size="22" font-weight="700" fill="#F4EEE2">ATENÇÃO</text>
  </g>

  <text x="140" y="360" class="font-fraunces" font-size="58" fill="#1B2520">
    <tspan x="140" dy="0">Vai protocolar</tspan>
    <tspan x="140" dy="68" fill="#1E5E4E">I-539 ou I-765?</tspan>
  </text>

  <rect x="140" y="440" width="800" height="220" rx="20" fill="#FBEDD4"/>
  <text x="180" y="500" class="font-hanken" font-size="26" font-weight="700" fill="#1E5E4E">O USCIS troca a edição amanhã.</text>
  <text x="180" y="545" class="font-hanken" font-size="24" fill="#1B2520">
    <tspan x="180" dy="0">Sem período de transição — protocolar com a</tspan>
    <tspan x="180" dy="36">edição errada pode significar pacote rejeitado.</tspan>
  </text>

  <g transform="translate(740, 800)">
    <rect x="0" y="0" width="200" height="52" rx="26" fill="#E8A33D"/>
    <text x="85" y="33" class="font-hanken" font-size="20" font-weight="700" fill="#1B2520">Deslize</text>
    <path d="M145 26 L155 26 M150 21 L155 26 L150 31" stroke="#1B2520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="540" y="955" class="font-hanken" font-size="18" fill="#1B2520" opacity="0.6" text-anchor="middle">Conteúdo informativo, não é aconselhamento jurídico.</text>
</svg>
